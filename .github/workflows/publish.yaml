name: Helm Publish

env:
    IMAGE_NAME: cert-manager-webhook-wedos
    IMAGE_TAG: ${{ github.sha }}
    IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Push to Registry action
        uses: actions/checkout@v4

      - name: lowercase image name
        run: |
          echo "IMAGE=`echo ${IMAGE_REGISTRY}/${IMAGE_NAME} | tr '[:upper:]' '[:lower:]'`" >>${GITHUB_ENV}

      - name: Build Image
        run: |
          docker build . --file Dockerfile --tag $IMAGE:${IMAGE_TAG} 
          docker tag $IMAGE:${IMAGE_TAG} $IMAGE:latest

      - name: Push Docker image
        run: |
          echo ${{ secrets.ACCESS_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE:${IMAGE_TAG}
          docker push $IMAGE:latest

  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.ACCESS_TOKEN }}"
